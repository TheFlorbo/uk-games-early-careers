# Companies to watch, grouped by the ATS that hosts their public job board.
#
# Every entry below was verified against the live endpoint on 2026-09-05.
# Entries showing 0 jobs at the time are real boards with nothing open — keep
# them, they fill up.
#
# ADDING A COMPANY
#   Don't guess. Run:   python scan.py --find "Company Name"
#   It tries every plausible slug against all five ATSs and prints a line you
#   can paste straight in here. If nothing is found, the company either hosts
#   its own careers page or uses an ATS this tool doesn't support yet.
#
#   Then re-run:        python scan.py --probe
#
#   type: games    -> a games studio or publisher
#   type: adjacent -> not games, but a realistic route in
#
# NOTE ON SMARTRECRUITERS: it returns an empty list rather than a 404 for an
# unknown company, so "0 jobs" there does NOT confirm the slug. Verify by
# opening jobs.smartrecruiters.com/<slug> in a browser before adding one.

