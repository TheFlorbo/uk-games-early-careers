name: Update job feed

on:
  schedule:
    - cron: "0 */4 * * *"     # every four hours
  workflow_dispatch:           # and on demand from the Actions tab
  push:
    branches: [main]
    paths: ["companies.yml", "config.yml", "**.py"]

# Never let two runs write state/seen.json at the same time.
concurrency:
  group: update-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python tests/run.py

      - name: Scan job boards
        run: python scan.py

      - name: Commit updated feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update feed: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
